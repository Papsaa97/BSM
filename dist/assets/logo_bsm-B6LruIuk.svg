<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 560" width="100%" height="100%">
  <defs>
    <linearGradient id="bsmBlueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b4884" />
      <stop offset="100%" stop-color="#072d54" />
    </linearGradient>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#eaf2f8" />
      <stop offset="100%" stop-color="#ffffff" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0b4884" flood-opacity="0.15" />
    </filter>
  </defs>

  <!-- Clip Path for Inside the Circle -->
  <clipPath id="circleClip">
    <circle cx="250" cy="230" r="210" />
  </clipPath>

  <!-- Outer Circle Frame -->
  <circle cx="250" cy="230" r="215" fill="none" stroke="#0b4884" stroke-width="12" filter="url(#shadow)" />
  <circle cx="250" cy="230" r="208" fill="url(#skyGrad)" />

  <!-- Inside Clipped Content -->
  <g clip-path="url(#circleClip)">
    <!-- Mountain Background Layers -->
    <!-- Far hills -->
    <path d="M 30,220 Q 140,110 260,170 T 470,160 L 470,260 L 30,260 Z" fill="#7ba3c7" opacity="0.5" />
    <!-- Mid hills -->
    <path d="M 20,230 Q 120,135 220,185 Q 320,130 480,210 L 480,270 L 20,270 Z" fill="#3571a8" opacity="0.75" />
    <!-- Front hills with trees -->
    <path d="M 10,240 Q 110,160 210,195 Q 310,150 490,230 L 490,270 L 10,270 Z" fill="#0b4884" />

    <!-- Stylized Pine Trees on the ridge -->
    <!-- Tree 1 -->
    <polygon points="340,155 334,168 346,168" fill="#072d54" />
    <polygon points="340,164 331,178 349,178" fill="#072d54" />
    <polygon points="340,172 329,188 351,188" fill="#072d54" />
    <!-- Tree 2 -->
    <polygon points="360,162 355,173 365,173" fill="#072d54" />
    <polygon points="360,170 353,182 367,182" fill="#072d54" />
    <polygon points="360,177 350,192 370,192" fill="#072d54" />
    <!-- Tree 3 -->
    <polygon points="380,175 376,184 384,184" fill="#072d54" />
    <polygon points="380,181 374,192 386,192" fill="#072d54" />
    <!-- Small trees left -->
    <polygon points="120,175 116,185 124,185" fill="#2c5a87" />
    <polygon points="120,182 114,194 126,194" fill="#2c5a87" />
  </g>

  <!-- Central White Band for Typography -->
  <rect x="50" y="200" width="400" height="95" fill="#ffffff" />
  
  <!-- BSM Text -->
  <text x="250" y="260" font-family="'Plus Jakarta Sans', 'Inter', 'Montserrat', 'Segoe UI', sans-serif" font-size="64" font-weight="900" fill="#0b4884" text-anchor="middle" letter-spacing="4">BSM</text>

  <!-- Slogan Divider Bar -->
  <line x1="75" y1="278" x2="135" y2="278" stroke="#0b4884" stroke-width="2.5" stroke-linecap="round" />
  <text x="250" y="282" font-family="'Plus Jakarta Sans', 'Inter', 'Montserrat', 'Segoe UI', sans-serif" font-size="12" font-weight="800" fill="#0b4884" text-anchor="middle" letter-spacing="2.5">BEZPEČNOST • STABILITA • MLÁDEŽ</text>
  <line x1="365" y1="278" x2="425" y2="278" stroke="#0b4884" stroke-width="2.5" stroke-linecap="round" />

  <!-- Bottom Stylized Human Community Figures -->
  <g fill="#0b4884">
    <!-- Center Figure (Adult/Leader) -->
    <circle cx="250" cy="316" r="16" />
    <!-- Body with raised welcoming arms -->
    <path d="M 234,342 C 220,336 200,326 195,310 C 193,304 201,300 205,307 C 215,324 235,338 250,338 C 265,338 285,324 295,307 C 299,300 307,304 305,310 C 300,326 280,336 266,342 L 274,388 C 274,394 268,398 262,398 L 238,398 C 232,398 226,394 226,388 Z" />

    <!-- Left Figure (Youth / Family) -->
    <circle cx="190" cy="336" r="13" />
    <path d="M 178,358 C 166,353 152,344 146,332 C 144,327 151,324 154,329 C 162,342 178,354 190,354 C 200,354 212,346 220,338 C 224,334 228,338 226,342 C 220,352 206,360 196,364 L 202,396 C 202,400 198,403 194,403 L 176,403 C 172,403 168,400 168,396 Z" />

    <!-- Right Figure (Youth / Family) -->
    <circle cx="310" cy="336" r="13" />
    <path d="M 322,358 C 334,353 348,344 354,332 C 356,327 349,324 346,329 C 338,342 322,354 310,354 C 300,354 288,346 280,338 C 276,334 272,338 274,342 C 280,352 294,360 304,364 L 298,396 C 298,400 302,403 306,403 L 324,403 C 328,403 332,400 332,396 Z" />
  </g>

  <!-- Elegant Arc / Banner for "Volební číslo 6" -->
  <g>
    <!-- Background pill for badge -->
    <rect x="90" y="475" width="320" height="66" rx="33" fill="#0b4884" filter="url(#shadow)" />
    <rect x="94" y="479" width="312" height="58" rx="29" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.3" />
    
    <!-- Text Volební číslo -->
    <text x="225" y="516" font-family="'Plus Jakarta Sans', 'Inter', 'Montserrat', 'Segoe UI', sans-serif" font-size="22" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="1.5">VOLEBNÍ ČÍSLO</text>
    <!-- Number 6 highlighted in gold/bright white -->
    <circle cx="355" cy="508" r="22" fill="#ffffff" />
    <text x="355" y="517" font-family="'Plus Jakarta Sans', 'Inter', 'Montserrat', 'Segoe UI', sans-serif" font-size="28" font-weight="900" fill="#0b4884" text-anchor="middle">6</text>
  </g>
</svg>
